[package]
name = "launcher"
version = "1.0.5"
edition = "2024"
description = "RLBot5 Launcher"
repository = "https://github.com/rlbot/launcher"
license-file = "LICENSE"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
console = "0.16.4"
directories = "6.0.0"
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha256 = "1.6.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
yansi = "1.0.1"

[build-dependencies]
embed-resource = "3.0.11"
static_vcruntime = "3.0.0"

[profile.release]
opt-level = "z"
strip = true
lto = true
